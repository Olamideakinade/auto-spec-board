<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Spec Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <div class="logo-area">
                <h1 class="logo">AutoSpec<span>Board</span></h1>
                <p class="tagline">High-Performance Automotive Specifications</p>
            </div>
            <nav class="nav-controls">
                <button id="btn-add-vehicle" class="btn btn-primary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    Add Vehicle
                </button>
                <button id="btn-export" class="btn btn-secondary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Export Data
                </button>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <section class="control-bar">
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="search-input" placeholder="Search by make, model, engine..." autocomplete="off">
            </div>
            <div class="filter-wrapper">
                <select id="filter-body" class="select-control">
                    <option value="">All Body Styles</option>
                    <option value="Coupe">Coupe</option>
                    <option value="Sedan">Sedan</option>
                    <option value="SUV">SUV</option>
                    <option value="Truck">Truck</option>
                    <option value="Convertible">Convertible</option>
                </select>
                <select id="sort-select" class="select-control">
                    <option value="default">Sort By</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="hp-desc">Horsepower: High to Low</option>
                    <option value="year-desc">Year: Newest</option>
                </select>
            </div>
        </section>

        <section id="vehicle-grid" class="vehicle-grid">
            <!-- Dynamic Cards Rendered Here -->
        </section>

        <div id="empty-state" class="empty-state hidden">
            <h3>No vehicles found</h3>
            <p>Try adjusting your search query or filters.</p>
        </div>
    </main>

    <!-- Add Vehicle Modal -->
    <div id="vehicle-modal" class="modal-backdrop hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Add New Vehicle Specification</h2>
                <button id="btn-close-modal" class="btn-close">&times;</button>
            </div>
            <form id="vehicle-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="make">Make</label>
                        <input type="text" id="make" required placeholder="e.g. Ferrari">
                    </div>
                    <div class="form-group">
                        <label for="model">Model</label>
                        <input type="text" id="model" required placeholder="e.g. F8 Tributo">
                    </div>
                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" required placeholder="2024" min="1900" max="2099">
                    </div>
                    <div class="form-group">
                        <label for="bodyStyle">Body Style</label>
                        <select id="bodyStyle" required>
                            <option value="Coupe">Coupe</option>
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Truck">Truck</option>
                            <option value="Convertible">Convertible</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="price">Price ($)</label>
                        <input type="number" id="price" required placeholder="280000" min="0">
                    </div>
                    <div class="form-group">
                        <label for="hp">Horsepower (HP)</label>
                        <input type="number" id="hp" required placeholder="710" min="0">
                    </div>
                    <div class="form-group full-width">
                        <label for="engine">Engine Layout</label>
                        <input type="text" id="engine" required placeholder="3.9L Twin-Turbocharged V8">
                    </div>
                    <div class="form-group full-width">
                        <label for="transmission">Transmission</label>
                        <input type="text" id="transmission" required placeholder="7-Speed Dual-Clutch">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btn-cancel" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Specification</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 AutoSpecBoard. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
