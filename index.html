<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Spec Board - High-Performance Automotive Specifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <div class="logo-area">
                <h1 class="logo">AutoSpec<span>Board</span></h1>
                <p class="tagline">High-Performance Automotive Specifications</p>
            </div>
            <nav class="nav-controls">
                <button id="btn-add-vehicle" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Add Specification</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="controls-section">
                <div class="search-filter-wrapper">
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" placeholder="Search by make, model, engine...">
                    </div>
                    <div class="sort-box">
                        <select id="sort-select">
                            <option value="default">Sort by: Featured</option>
                            <option value="hp-desc">Horsepower: High to Low</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="make-asc">Make: Alphabetical</option>
                        </select>
                    </div>
                </div>
                <div class="filter-pills">
                    <button class="filter-btn active" data-filter="all">All Styles</button>
                    <button class="filter-btn" data-filter="Coupe">Coupe</button>
                    <button class="filter-btn" data-filter="Sedan">Sedan</button>
                    <button class="filter-btn" data-filter="Truck">Truck</button>
                </div>
            </section>

            <div class="board-stats">
                <span id="vehicle-count">Loading vehicles...</span>
                <div class="board-actions">
                    <button id="btn-export-json" class="btn btn-secondary" style="padding: 0.4rem 0.75rem; font-size: 0.8rem;">Export JSON</button>
                    <button id="btn-reset" class="btn btn-secondary" style="padding: 0.4rem 0.75rem; font-size: 0.8rem;">Factory Reset</button>
                </div>
            </div>

            <div id="vehicle-grid" class="vehicle-grid">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </main>

    <div id="vehicle-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Vehicle Specification</h2>
                <button id="close-modal" class="btn-close">&times;</button>
            </div>
            <form id="vehicle-form">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="make">Make</label>
                            <input type="text" id="make" required placeholder="e.g. Porsche">
                        </div>
                        <div class="form-group">
                            <label for="model">Model</label>
                            <input type="text" id="model" required placeholder="e.g. 911 GT3">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="year">Year</label>
                            <input type="number" id="year" required value="2024" min="1900" max="2030">
                        </div>
                        <div class="form-group">
                            <label for="bodyStyle">Body Style</label>
                            <select id="bodyStyle" required>
                                <option value="Coupe">Coupe</option>
                                <option value="Sedan">Sedan</option>
                                <option value="Truck">Truck</option>
                                <option value="SUV">SUV</option>
                                <option value="Convertible">Convertible</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="hp">Horsepower (HP)</label>
                            <input type="number" id="hp" required placeholder="e.g. 502" min="1">
                        </div>
                        <div class="form-group">
                            <label for="price">MSRP ($)</label>
                            <input type="number" id="price" required placeholder="e.g. 223400" min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="engine">Engine Specification</label>
                        <input type="text" id="engine" required placeholder="e.g. 4.0L Flat-6">
                    </div>
                    <div class="form-group">
                        <label for="transmission">Transmission</label>
                        <input type="text" id="transmission" required placeholder="e.g. 7-Speed PDK">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancel-modal" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Specification</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 Auto Spec Board. Engineered for high-performance automotive data.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
